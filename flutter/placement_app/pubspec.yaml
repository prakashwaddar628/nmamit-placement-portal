name: placement_app
description: NMAMIT Placement Portal - Student and Admin mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Image Caching
  cached_network_image: ^3.4.1

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Charts
  fl_chart: ^0.69.0

  # File Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.3

  # Typography
  google_fonts: ^6.2.1

  # Loading effects
  shimmer: ^3.0.0

  # Progress indicators
  percent_indicator: ^4.2.3

  # Date/Number formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
